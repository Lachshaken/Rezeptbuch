<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Julia's & Diana's Rezeptbuch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Ganz obere orange Leiste -->
  <div class="top-banner">
    Julia's & Diana's Rezeptbuch
  </div>

  <!-- Hero-Bereich mit der großen Überschrift -->
  <header class="hero">
    <h1>Rezeptbuch</h1>
  </header>

  <!-- Haupt-Layout: Sidebar links + Kacheln rechts -->
  <div class="layout-container">
    
    <!-- Linke minimalistische Sidebar -->
    <aside class="sidebar">
      
      <!-- Kategorien-Liste -->
      <ul class="category-list" id="categoryList">
        <li class="active" data-category="All">ALLE KATEGORIEN</li>
        <li data-category="Frühstück">FRÜHSTÜCK</li>
        <li data-category="Hauptgericht">HAUPTGERICHT</li>
        <li data-category="Beilagen">BEILAGEN</li>
        <li data-category="Suppen">SUPPEN</li>
        <li data-category="Dessert">DESSERT</li>
      </ul>

      <!-- Suchfeld & Zufallsbutton im passenden Stil -->
      <div class="sidebar-controls">
        <input type="text" id="searchInput" placeholder="Zutat suchen...">
        <button id="randomBtn" class="random-btn">🎲 Zufall</button>
      </div>

    </aside>

    <!-- Rechte Seite mit den Kacheln -->
    <main class="content-area">
      <div class="recipe-grid" id="recipeGrid"></div>
    </main>

  </div>

  <!-- Modal/Popup für das Rezept -->
  <div id="recipeModal" class="modal">
    <div class="modal-content">
      <span class="close-btn">&times;</span>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
