<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Julia's & Diana's Rezeptbuch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 1. Top Banner ganz oben -->
  <div class="top-banner">
    20% ON SHOTS THIS WEEK — RECHARGE DAILY
  </div>

  <!-- 2. Navigationsleiste -->
  <nav class="top-nav">
    <div class="nav-left">MENU 17</div>
    <div class="nav-center">
      rezeptbuch <span class="asterisk">*</span>
    </div>
    <div class="nav-right">
      <span class="nav-icon">✉</span>
      <span class="nav-icon">✕</span>
      <span class="nav-icon">📷</span>
      <button class="nav-btn">USE FOR FREE</button>
    </div>
  </nav>

  <!-- 3. Riesige Headline -->
  <header class="hero">
    <h1>Julia's & Diana's<br>Rezeptbuch</h1>
  </header>

  <!-- 4. Haupt-Layout -->
  <div class="layout-container">
    
    <!-- Linke Sidebar -->
    <aside class="sidebar">
      <ul class="category-list" id="categoryList">
        <li class="active" data-category="All">ALL 17</li>
        <li data-category="Frühstück">FRÜHSTÜCK 4</li>
        <li data-category="Hauptgericht">HAUPTGERICHT 5</li>
        <li data-category="Beilagen">BEILAGEN 3</li>
        <li data-category="Suppen">SUPPEN 2</li>
        <li data-category="Dessert">DESSERT 3</li>
      </ul>

      <!-- Eingabefelder -->
      <div class="sidebar-controls">
        <input type="text" id="searchInput" placeholder="Zutat suchen...">
        <button id="randomBtn" class="random-btn">🎲 Zufall</button>
      </div>
    </aside>

    <!-- Kachelbereich -->
    <main class="content-area">
      <div class="recipe-grid" id="recipeGrid"></div>
    </main>

  </div>

  <!-- Modal Popup -->
  <div id="recipeModal" class="modal">
    <div class="modal-content">
      <span class="close-btn">&times;</span>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
