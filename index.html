<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rezeptbuch</title>
  
  <style>
    /* Grund-Einstellungen */
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #f8f9fa;
    }

    /* Oben verankerte Kopfzeile */
    header {
      background-color: #ffffff;
      border-bottom: 1px solid #e0e0e0;
      padding: 15px 20px;
    }

    /* Vorgabe: Schriftart Arial, Größe 20px */
    header h1 {
      margin: 0;
      font-family: Arial, sans-serif;
      font-size: 20px;
      font-weight: bold;
      color: #333333;
    }

    /* Haupt-Layout: Sidebar links + Inhalt rechts */
    .layout-container {
      display: flex;
      min-height: calc(100vh - 55px); /* Restliche Bildschirmhöhe ausfüllen */
    }

    /* Linkes Menüband (Sidebar) */
    .sidebar {
      width: 250px;
      background-color: #ffffff;
      border-right: 1px solid #e0e0e0;
      padding: 20px;
      box-sizing: border-box;
      flex-shrink: 0;
    }

    .sidebar h2 {
      font-size: 16px;
      margin-top: 0;
      margin-bottom: 15px;
      color: #555555;
    }

    /* Styling für die Bedienelemente im Menüband */
    .filter-group {
      margin-bottom: 20px;
    }

    .filter-group label {
      display: block;
      font-size: 14px;
      margin-bottom: 5px;
      color: #666;
    }

    .filter-group input,
    .filter-group select,
    .filter-group button {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }

    .btn-random {
      background-color: #ff6b6b;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    .btn-random:hover {
      background-color: #ee5253;
    }

    /* Hauptbereich rechts für die Bilderkacheln */
    .content-area {
      flex-grow: 1;
      padding: 20px;
    }
  </style>
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Kopfzeile oben -->
  <header>
    <h1>Rezeptbuch</h1>
  </header>

  <!-- Layout-Container für Menüband + Inhalte -->
  <div class="layout-container">
    
    <!-- Linkes Menüband -->
    <aside class="sidebar">
      <h2>Filter & Suche</h2>
      
      <!-- Zutaten-Suche -->
      <div class="filter-group">
        <label for="searchInput">Zutat suchen:</label>
        <input type="text" id="searchInput" placeholder="z. B. Tomate...">
      </div>

      <!-- Kategorien-Auswahl -->
      <div class="filter-group">
        <label for="categorySelect">Kategorie:</label>
        <select id="categorySelect">
          <option value="All">Alle Kategorien</option>
          <option value="Frühstück">Breakfast</option>
          <option value="Hauptgang">Main Dish</option>
          <option value="Beilagen>Side Course</option>
          <option value="Suppen">Suppen</option>
          <option value="Dessert">Dessert</option>
        </select>
      </div>

      <!-- Zufalls-Button -->
<!-- Zufalls-Button (Uiverse-Design) -->
<div class="filter-group">
  <button id="randomBtn">
    <span class="text">Zufallsrezept</span>
    <div class="blob"></div>
    <div class="blob"></div>
    <div class="blob"></div>
    <div class="blob"></div>
  </button>
</div>

  </div>

  <!-- Modal / Popup für die Rezeptansicht -->
  <div id="recipeModal" class="modal">
    <div class="modal-content">
      <span class="close-btn">&times;</span>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
